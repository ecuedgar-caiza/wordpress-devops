name: WordPress VPS Backup

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Selecciona el sitio a respaldar'
        required: true
        default: 'all'
        type: choice
        options:
          - wp_acjsolution
          - wp_ai_client1
          - all

jobs:
  backup:
    runs-on: self-hosted
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar respaldo local en VPS
        env:
          SITE: ${{ github.event.inputs.site }}
        run: |
          chmod +x scripts/backup_wordpress.sh
          ./scripts/backup_wordpress.sh "$SITE"
          mkdir -p ./artifacts
          cp /tmp/backups/backup_*.tar.gz ./artifacts/
          rm -rf /tmp/backups

      - name: Subir Artifact a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-backup-${{ github.event.inputs.site }}-${{ github.run_id }}
          path: ./artifacts/*.tar.gz
          retention-days: 7
